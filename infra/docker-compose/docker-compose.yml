# ==========================================================
# RF-WorldPose — Local Dev Stack
# ==========================================================
# Chạy: docker compose up -d
# Dừng: docker compose down
# Reset data: docker compose down -v
#
# Tất cả credentials đọc từ .env ở root dự án.
# Không hardcode password trong file này.
# ==========================================================

x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  S3_ENDPOINT_URL: http://minio:9000
  S3_BUCKET: ${S3_BUCKET}

x-db-url: &db-url
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

services:
  # ── Data stores ───────────────────────────────────────────

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5434:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 3s
      retries: 10

  nats:
    image: nats:2.10
    command: ["-js", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"   # S3 API
      - "9003:9001"   # Console UI
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      retries: 10

  # ── MinIO init (chạy 1 lần rồi exit) ─────────────────────

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: |
      -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${S3_BUCKET} &&
      for d in bronze silver gold models mlflow; do
        echo '{}' | mc pipe local/${S3_BUCKET}/\$$d/.keep 2>/dev/null || true
      done &&
      echo 'MinIO bucket ready: ${S3_BUCKET}'
      "

  # ── Application services ──────────────────────────────────

  api:
    image: python:3.11-slim
    working_dir: /app
    command: >
      sh -c "apt-get update -qq && apt-get install -y -qq openssh-client rsync >/dev/null 2>&1;
             mkdir -p /root/.ssh && cp /ssh-keys/* /root/.ssh/ 2>/dev/null;
             chmod 600 /root/.ssh/id_ed25519 2>/dev/null;
             printf 'Host eagle\n  HostName eagle.man.poznan.pl\n  User tiencd1234\n  IdentityFile /root/.ssh/id_ed25519\n  StrictHostKeyChecking accept-new\n' > /root/.ssh/config;
             pip install --quiet -e services/api &&
             PYTHONPATH=/app/eagle_runner:$$PYTHONPATH uvicorn rfpose_api.main:app --host 0.0.0.0 --port 8080"
    environment:
      <<: [*db-url, *s3-env]
      MLFLOW_TRACKING_URI: http://207.180.243.242:5000
      HPC_LOGIN: eagle.man.poznan.pl
      HPC_USER: tiencd1234
      HPC_SSH_KEY: /root/.ssh/id_ed25519
      HPC_ACCOUNT: pl0501-01
      HPC_PARTITION: tesla
      HPC_WORK_DIR: ~/pl0501-01/project_data/rf-worldpose
    ports: ["8080:8080"]
    volumes:
      - "../../:/app"
      - "/root/.ssh:/ssh-keys:ro"
    depends_on:
      postgres:
        condition: service_healthy

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: >
      mlflow server
        --host 0.0.0.0 --port 5000
        --backend-store-uri sqlite:////mlflow/mlflow.db
        --default-artifact-root s3://${S3_BUCKET}/mlflow
        --allowed-hosts ${MLFLOW_SERVER_ALLOWED_HOSTS}
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MLFLOW_SERVER_ALLOWED_HOSTS: ${MLFLOW_SERVER_ALLOWED_HOSTS}
    ports: ["5000:5000"]
    volumes: ["mlflow-data:/mlflow"]
    depends_on:
      minio:
        condition: service_healthy

  dagster:
    image: python:3.11-slim
    working_dir: /app
    command: >
      sh -c "mkdir -p /app/.dagster &&
             pip install dagster dagster-webserver --quiet &&
             pip install --quiet -e pipelines/dagster &&
             dagster dev -h 0.0.0.0 -p 3001 -m rfpose_pipelines"
    environment:
      <<: [*db-url, *s3-env]
      DAGSTER_HOME: /app/.dagster
    ports: ["3004:3001"]
    volumes: 
      - ../../:/app:cached
      - dagster_home:/app/.dagster
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ── Monitoring ────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports: ["3002:3000"]
    volumes: ["grafana-data:/var/lib/grafana"]

  loki:
    image: grafana/loki:2.9.8
    command: -config.file=/etc/loki/local-config.yaml
    ports: ["3100:3100"]

volumes:
  pgdata:
  minio-data:
  mlflow-data:
  grafana-data:
  dagster_home:
