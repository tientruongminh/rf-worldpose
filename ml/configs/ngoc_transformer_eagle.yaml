# Kim Ngọc — CSITransformerPose (transformer_train.py, default arch)
# Same Proto-1 MM-Fi data as WiMose baseline.
defaults:
  - humanlike_mmfi17_proto1
  - _self_

model:
  n_decoder_layers: 3
  n_decoder_temporal_layers: 2
  num_actions: 28

loss:
  weighting_mode: "uncertainty"
  lambda_vis: 0.5
  lambda_bone: 0.3
  lambda_temporal: 0.2
  lambda_symmetry: 0.1

training:
  batch_size: 32
  epochs: 120
  lr: 3.0e-5
  patience: 30
  num_workers: 4
  checkpoint_dir: "/mnt/storage_6/project_data/pl0501-01/rf-worldpose/checkpoints/ngoc-transformer-mmfi17-proto1-v1"

mlflow:
  experiment_name: "rf-worldpose-transformer"
  run_name: "ngoc-transformer-mmfi17-proto1-v1"
