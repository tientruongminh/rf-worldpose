# Root-Relative + Weighted Joint Loss on MM-Fi
# Upweight knees/ankles (2x error vs upper body from eval)
# 13 joints: head, l_shoulder, l_elbow, l_wrist, r_shoulder, r_elbow, r_wrist,
#            l_hip, l_knee, l_ankle, r_hip, r_knee, r_ankle
defaults:
  - transformer_gold

data:
  gold_dir: "pl0501-01/project_data/rf-worldpose/data/gold/rfpose-unified-v2"
  datasets: ["mmfi"]
  val_ratio: 0.2
  require_pose: true
  require_action: true
  augment: true

model:
  variant: "rootrel"

loss:
  lambda_root: 1.5
  lambda_offset: 1.5
  lambda_bone: 0.5
  lambda_temporal: 0.3
  # Per-joint weights: 1.0 for upper body, 2.0 for knees, 2.5 for ankles
  joint_weights: [1.0, 1.0, 1.0, 1.2, 1.0, 1.0, 1.2, 1.0, 2.0, 2.5, 1.0, 2.0, 2.5]

training:
  device: "cuda"
  batch_size: 32
  epochs: 300
  lr: 5.0e-5
  warmup_epochs: 10
  patience: 40
  save_every: 10
  log_every: 50
  amp: true
  num_workers: 4
  dry_run: false
  ssl_pretrained: "s3://rfpose/mlflow/5/62a95b29c2e3499e82983f5e8ecb120e/artifacts/checkpoints/best"
  freeze_encoder: false

mlflow:
  tracking_uri: "http://207.180.243.242:5000"
  experiment_name: "rf-worldpose-transformer"
  run_name: "rootrel-mmfi-weighted-v1"
