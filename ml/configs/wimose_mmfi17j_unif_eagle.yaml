# Wi-Mose on MM-Fi — GCN head + Structured Loss + Uniformity Regularisation
#
# Tier 1 anti-collapse: adds uniformity loss on backbone features so the feature
# space spreads on the unit hypersphere (Wang et al. 2020), plus hard-joint
# weighting (wrists/feet 3×, knees/elbows 2×, hips/shoulders 1.5×).
# Runs alongside the GCN job; separate checkpoint dir so both persist.

data:
  gold_dir: "/tmp/rfpose_gold_mmfi_proto1_SLURM_JOB_ID"   # overridden by sbatch
  datasets: ["mmfi"]
  n_joints: 17
  n_subcarriers: 342
  window_size: 60
  augment: true
  require_pose: true
  normalize_csi: true
  center_pose: true
  root_joint: 0         # H36M Pelvis

model:
  use_gcn_head: true    # GCN decoder
  gcn_dim: 256
  gcn_layers: 3

loss:
  huber_delta: 0.75
  lambda_bone: 0.5
  lambda_sym: 0.1
  lambda_div: 0.05
  lambda_unif: 0.01     # uniformity regularisation on backbone features

training:
  device: "cuda"
  epochs: 120
  batch_size: 32
  lr: 1.0e-3
  weight_decay: 1.0e-4
  warmup_epochs: 5
  patience: 30
  save_every: 10
  amp: true
  num_workers: 2
  seed: 42
  checkpoint_dir: "/mnt/storage_6/project_data/pl0501-01/rf-worldpose/checkpoints/wimose-mmfi17j-unif-v1"

mlflow:
  tracking_uri: "http://207.180.243.242:5000"
  experiment_name: "rf-worldpose-wimose"
  run_name: "wimose-mmfi17j-gcn-unif-v1"
