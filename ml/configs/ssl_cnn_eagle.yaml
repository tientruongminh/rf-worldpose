# Bảo Ngân — SSL Encoder + Temporal CNN Head (transformer_train.py, arch: ssl_cnn)
# Same Proto-1 MM-Fi data as WiMose baseline.
defaults:
  - humanlike_mmfi17_proto1
  - _self_

model:
  arch: ssl_cnn
  cnn_hidden_dim: 256
  cnn_layers: 2
  cnn_kernel_size: 3
  dropout: 0.1

training:
  batch_size: 32
  epochs: 120
  lr: 1.0e-4
  patience: 30
  checkpoint_dir: "/mnt/storage_6/project_data/pl0501-01/rf-worldpose/checkpoints/ssl-cnn-mmfi17-proto1-v1"

mlflow:
  experiment_name: "rf-worldpose-transformer"
  run_name: "ssl-cnn-ngan-mmfi17-proto1-v1"
