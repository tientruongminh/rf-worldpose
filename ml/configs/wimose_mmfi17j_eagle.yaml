# Wi-Mose (arXiv:2012.14066v1) on MM-Fi 17-joint H36M dataset
# 2-GPU DDP training via torchrun --nproc_per_node=2

data:
  gold_dir: "/mnt/storage_6/project_data/pl0501-01/rf-worldpose/data/gold/rfpose-humanlike-v2"
  datasets: ["mmfi"]
  n_joints: 17
  n_subcarriers: 342
  window_size: 60
  augment: true
  require_pose: true
  normalize_csi: true   # per-channel z-score (amp mean~38 fed raw was a bug)
  center_pose: true     # root-relative GT (z was ~3.14m absolute depth)
  root_joint: 0         # H36M Pelvis

model:
  use_gcn_head: false

loss:
  huber_delta: 0.75   # exact value from Wi-Mose paper

training:
  device: "cuda"
  epochs: 120
  batch_size: 32        # per-GPU batch; effective batch = 32 × n_gpus
  lr: 1.0e-3
  weight_decay: 1.0e-4
  warmup_epochs: 5
  patience: 30
  save_every: 10
  amp: true
  num_workers: 0
  seed: 42
  checkpoint_dir: "/mnt/storage_6/project_data/pl0501-01/rf-worldpose/checkpoints/wimose-mmfi17j-v1"

mlflow:
  tracking_uri: "http://207.180.243.242:5000"
  experiment_name: "rf-worldpose-wimose"
  run_name: "wimose-mmfi17j-2gpu-v1"
