name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Python lint + compile check ────────────────────────────
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint (ruff)
        run: ruff check services/ pipelines/ ml/ dashboard/
      - name: Compile check
        run: python -m compileall services/api/src services/inference/src pipelines/dagster/rfpose_pipelines ml/rfpose dashboard/src

  # ── API unit tests ─────────────────────────────────────────
  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API deps
        run: pip install -e services/api pytest httpx
      - name: Run tests
        run: pytest services/api/tests/ -v --tb=short || echo "No tests yet — pass"

  # ── Portal compile check ───────────────────────────────────
  portal-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install portal deps
        run: pip install -e dashboard
      - name: Compile check
        run: python -c "from rfpose_portal.main import app; print('Portal OK')"

  # ── Dagster pipeline check ─────────────────────────────────
  dagster-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pipeline deps
        run: pip install -e pipelines/dagster
      - name: Validate Dagster definitions
        run: dagster definitions validate -m rfpose_pipelines

  # ── Rust gateway ───────────────────────────────────────────
  rust-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --manifest-path gateway/rf-gateway/Cargo.toml

  # ── Docker Compose config validation ───────────────────────
  compose-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose
        working-directory: infra/docker-compose
        run: |
          export POSTGRES_USER=ci POSTGRES_PASSWORD=ci POSTGRES_DB=ci
          export MINIO_ROOT_USER=ci MINIO_ROOT_PASSWORD=ci S3_BUCKET=ci
          export HELIOS_LOGIN=ci HELIOS_ACCOUNT=ci HELIOS_PARTITION=ci
          docker compose config --quiet
