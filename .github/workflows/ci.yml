name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Python compile check (fast, no external deps) ─────────
  python-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile check — API
        run: python -m compileall -q services/api/src/rfpose_api/ || true
      - name: Compile check — Portal
        run: python -m compileall -q dashboard/src/rfpose_portal/ || true
      - name: Compile check — ML
        run: python -m compileall -q ml/rfpose/ || true

  # ── Docker Compose config validation ───────────────────────
  compose-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose
        working-directory: infra/docker-compose
        run: |
          export POSTGRES_USER=ci POSTGRES_PASSWORD=ci POSTGRES_DB=ci
          export MINIO_ROOT_USER=ci MINIO_ROOT_PASSWORD=ci S3_BUCKET=ci
          export HELIOS_LOGIN=ci HELIOS_ACCOUNT=ci HELIOS_PARTITION=ci
          docker compose config --quiet
